services:
  sonarqube-db:
    container_name: sonarqube-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - sonarnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    container_name: sonarqube-server
    image: sonarqube:latest
    depends_on:
      sonarqube-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_WEB_HOST=0.0.0.0
      - SONAR_WEB_PORT=9000
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      # 15.5GiB workstation: keep the stack off the OOM boundary.
      - SONAR_WEB_JAVAOPTS=-Xmx1536m -Xms512m
      - SONAR_CE_JAVAOPTS=-Xmx1024m -Xms256m
      - SONAR_SEARCH_JAVAOPTS=-Xmx1024m -Xms512m
    mem_limit: 4g
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    networks:
      - sonarnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Self-contained MCP endpoint for OpenCode: Streamable HTTP transport.
  # Clients authenticate per-request via `Authorization: Bearer {env:SONARQUBE_TOKEN}`
  # (token lives in dots/shell/.cache/sonarqube.env — gitignored, sourced by .bashrcx).
  sonar-mcp:
    container_name: sonarqube-mcp
    image: sonarsource/sonarqube-mcp:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SONARQUBE_TRANSPORT=http
      - SONARQUBE_HTTP_HOST=0.0.0.0
      - SONARQUBE_HTTP_PORT=8080
      - SONARQUBE_URL=http://sonarqube:9000
      - SONAR_JAVAOPTS=-Xmx512m
    mem_limit: 768m
    networks:
      - sonarnet

networks:
  sonarnet:
    name: docker-llms_default

volumes:
  sonarqube_postgres_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_temp:
    driver: local
