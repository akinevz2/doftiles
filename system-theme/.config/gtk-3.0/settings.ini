# system-theme — session-wide GTK3 activation (HlwmAccessible).
# GTK reads this as the CURRENT gtk-theme-name, which is what beats
# /etc/gtk-3.0/settings.ini (Yaru) — no XSETTINGS daemon needed. The
# GTK_THEME env var only sets the property DEFAULT and loses to any
# settings.ini current value, so per-invocation env launching is NOT
# the reliable route on this system.
[Settings]
gtk-theme-name = HlwmAccessible
gtk-application-prefer-dark-theme = true
