# xrdp.ini — USER-level xrdp (static config, stowed from the dots
# repo; nothing edits /etc). xrdp runs as a USER service
# (~/.config/systemd/user/xrdp.service) on :3390 — 3389 stays free
# for the Windows side's own RDP / netsh portproxy. The single Xvnc
# module attaches to the shared x11vnc framebuffer on localhost:5900
# (the same session noVNC serves) — an RDP client lands in the
# running hlwm session, no per-connection spawn.
#
# Requires: xrdp (on-deploy pkg install xrdp) + x11vnc listening on
# :5900 (the nested stack).

[Globals]
# RDP listen port — 3390 (user-level; the stock 3389 is avoided)
port=3390
security_layer=negotiate
crypt_level=low
allow_channels=true
max_bpp=32
bulk_compression=true

[Xvnc]
name=hlwm session (shared framebuffer)
lib=libvnc.so
port=5900
# ask for the VNC credentials x11vnc was started with
username=ask
password=ask
