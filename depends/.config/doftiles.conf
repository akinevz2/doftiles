# doftiles.conf — deployment state tracked by depends/Makefile.
#
# Flat KEY=VALUE, sourceable by sh. Stowed from the depends package to
# ~/.config/doftiles.conf; the file lives in the repo, so method
# changes made by `make deploy-*` show up as a tracked diff.
#
# POLYFRAMES_METHOD — how the polyframes artifact was deployed:
#   source  built from the git submodule checkout (deploy-fromsource)
#   npm     installed via npm (deploy-fromnpm)
#   none    not deployed by doftiles
# BAT_METHOD — how the bat artifact was deployed:
#   source  cargo build from the bat-src checkout (rust toolchain via
#           `on-deploy toolchain --rustup`)
#   release upstream GitHub release artifact
#   none    not deployed by doftiles
#
# Method defaults (2026-11): every submodule deploys FROM SOURCE —
# doftiles ships source as the default for POLYFRAMES and BAT alike.
# The per-package Makefiles additionally treat a recorded "none"
# (only ever written by an explicit uninstall) as unset and re-resolve
# the default, so a stale "none" in a live conf never fails make update.
POLYFRAMES_METHOD=source
BAT_METHOD=source
