# doftiles.conf — deployment state tracked by the depends package.
#
# Flat KEY=VALUE, sourceable by sh. Stowed from the depends package to
# ~/.config/doftiles.conf; the file lives in the repo, so method
# changes made by package Makefiles (conf-set) show up as a tracked
# diff.
#
# Deployment-method records, one KEY per submodule package (2026-11):
# the key is the UPPERCASE package name, the value the lowercase
# method — extensible by design: future submodule packages add their
# own <PKG>=<method> key. Each package's depends Makefile owns its
# valid method set and rejects unknown values up front with the valid
# list. "none" only ever appears after an explicit uninstall and
# resolves as unset (the package's default re-resolves).
#
# Valid methods: source, or pkg — the package managers the on-deploy
# transports implement (lib/pkgmanagers.ts: registry ids bun/npm and
# the deploy target's platform apm = apt|pacman). The pkg method reads
# the adapter's metadata repos_pkg coverage and picks the first
# available repository in order (registry before system). "none" only
#
#   BAT         source | pkg   (default source)
#   POLYFRAMES  source | pkg   (pkg -> bun|npm via repos_pkg coverage)
#   HERBCTL     source | pkg
#   HERBSTUTIL  source | pkg
#   ON_DEPLOY   source         (source-only for now: the binary is not
#               published to the transports yet)
#   GET         source         (source-only: plain shell files, no
#               toolchain, no pkg transport)
BAT=source
POLYFRAMES=source
HERBCTL=source
HERBSTUTIL=source
ON_DEPLOY=source

#	opencode — REGISTRY METApackage: no submodule, no source route;
#	pkg is the only valid method and bun the only transport
#	(@opencode/cli, opencode-ai's release channel)
OPENCODE=pkg

GET=source
