# compton on WSL2 → VcXsrv (X11 over localhost TCP).
# backend = xrender: compositing happens server-side via the RENDER
# extension — no GLX, no indirect-rendering quirks (A/B tested against
# glx: slightly lower CPU and a clean startup log on VcXsrv).
# There is no meaningful vblank over a networked X socket, so vsync
# stays explicitly off. Shadows/fading intentionally off (lean).
refresh-rate = 0
backend = xrender
vsync = false
